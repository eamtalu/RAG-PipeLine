      tools: [wms_activity, chart_from_data]
      blocks: [heatmap]

  # ---------------------------------------------------------------- fix of 14 November: devices per day, the people table
  - name: devices_per_day_with_grain_and_device_cut_still_draws_the_days
    question: How many devices were in use per day in the week to 18 September 2026?
    replies:
      - tool: wms_activity
        args: {start: "2026-09-11", end: "2026-09-18", grain: day, by: device}
      - tool: show_kpis
