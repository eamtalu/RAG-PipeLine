      - text: "Up to 3 handhelds were in use a day, on 2026-09-18; 2 on each of the two days before."
    expect:
      stop_reason: end_turn
      tools: [wms_activity, show_kpis]
      blocks: [kpis, chart]

  - name: who_was_active_with_the_people_written_as_bullets_still_gets_the_table
    question: Who was active on 18 September 2026, and when did each person start and finish?
    replies:
      - tool: wms_activity
        args: {by: user, day: "2026-09-18"}
      - text: "Three people were active on 2026-09-18:\n- BCHAM from 06:15 to 07:15\n- PEVANS at 06:15\n- DBOBOC at 09:15"
    expect:
      stop_reason: end_turn
      tools: [wms_activity]
      blocks: [kpis, table]

  # ---------------------------------------------------------------- step 21: the story of one delivery
  # `plant_delivery_story`: delivery 25899 on 18 September 2026, BCHAM, a soft error on the first
  # package call, three picks (two exact, one over), a package and a photo.

  - name: the_details_of_one_delivery_come_from_its_story
    question: give me the details of delivery 25899 on 18 September 2026
    replies:
      - tool: delivery_story
        args: {value: "25899", day: "2026-09-18"}
      - text: "Delivery 25899 was picked by BCHAM between 07:10 and 07:20: 3 lines, 2 exact and 1 over (item 104441, 4.08 against 4). The first package call returned a soft error, then the package and its photo were recorded."
    expect:
      stop_reason: end_turn
      tools: [delivery_story]
      blocks: [kpis, table]

  # ---------------------------------------------------------------- step 23: counts by their label, no follow-ups in the text
  # The live answer of 15 November said "9 packages" for delivery 33330 (8 packages, 9 photos).
  - name: each_count_of_a_delivery_goes_by_its_own_label
    question: how many packages and photos does delivery 25899 have on 18 September 2026?
    replies:
      - tool: delivery_story
        args: {value: "25899", day: "2026-09-18"}
      - text: "Delivery 25899 has 1 package and 1 photo, recorded after a soft error on the first package call."
    expect:
      stop_reason: end_turn
      tools: [delivery_story]
      answer_contains: ["1 package and 1 photo"]
      answer_excludes: ["2 packages", "2 photos"]

  - name: follow_ups_on_chips_are_not_also_written_in_the_text
    question: give me the details of delivery 25899 on 18 September 2026
    replies:
      - tool: delivery_story
        args: {value: "25899", day: "2026-09-18"}
      - tool: suggest_followups
        args: {items: ["Which items were over-picked?", "Who picked it?"]}
      - text: "Delivery 25899 was picked by BCHAM between 07:10 and 07:20: 3 lines, 2 exact and 1 over.\n\nWhich items were over-picked?\nWho picked it?"
    expect:
      stop_reason: end_turn
      tools: [delivery_story, suggest_followups]
      answer_contains: ["3 lines, 2 exact and 1 over."]
      answer_excludes: ["Which items were over-picked?", "Who picked it?"]

  # ---------------------------------------------------------------- step 22: facts as bullets, the order named
  - name: fact_bullets_survive_beside_the_rendered_table
    question: Which products were short on 18 September 2026, and by how much?
    replies:
      - tool: aggregate_releases
        args:
          group_by: [item_number]
          where: ["shortfall<0"]
          sort: units_short
          start: "2026-09-18T04:44:42+00:00"
          end: "2026-09-18T07:44:42+00:00"
      - text: "Two items were short on 18 September 2026, across 3 releases.\n\n- 100230 was the biggest gap, 10 units short\n- 104568 was short by 1 unit"
    expect:
      stop_reason: end_turn
      tools: [aggregate_releases]
      evidence: true
      answer_contains: ["- 100230 was the biggest gap, 10 units short", "- 104568 was short by 1 unit"]

  - name: the_fewest_is_named_the_fewest_when_the_rows_run_smallest_first
    question: Which picker picked the fewest units on 18 September 2026?
    replies:
      - tool: aggregate_releases
        args:
          group_by: [user_name]
          sort: picked
          dir: asc
          start: "2026-09-18T04:44:42+00:00"
          end: "2026-09-18T07:44:42+00:00"
      - text: "DBOBOC picked the fewest units on 18 September 2026, 8, across 3 releases; FNACHONLEO picked 9."
    expect:
      stop_reason: end_turn
      tools: [aggregate_releases]
      answer_contains: ["picked the fewest units"]
      answer_excludes: ["picked the most units"]
