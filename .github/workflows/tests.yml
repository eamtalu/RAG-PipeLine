# The backend's CI: the whole test suite on every push and pull request, against a fresh
# pgvector Postgres, with the same Python and test tools as the developer's .venv.
# docs/ci-and-golden-questions.md explains the jobs.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # the golden questions against the real model, 03:00 UTC

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
  TZ: Europe/London
  LOG_OUTPUT: text
  PYTHONPATH: ${{ github.workspace }}

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the app and the test tools
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply the migrations
        run: alembic upgrade head
      - name: Run the suite
        run: pytest -q -p no:cacheprovider

  # The golden questions against the real model (docs/ci-and-golden-questions.md). Needs the
  # repository secrets BEDROCK_AWS_ACCESS_KEY_ID and BEDROCK_AWS_SECRET_ACCESS_KEY and the variable
  # ANALYTICS_AGENT_MODEL; without the key the job says so and passes, so the workflow is valid
  # before they exist.
  golden-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      ANALYTICS_AGENT_MODEL: ${{ vars.ANALYTICS_AGENT_MODEL }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Say so when the model credentials are not configured
        if: env.AWS_ACCESS_KEY_ID == ''
        run: echo "::notice::BEDROCK_AWS_ACCESS_KEY_ID is not set; the real-model run is skipped"
      - uses: actions/checkout@v4
        if: env.AWS_ACCESS_KEY_ID != ''
      - uses: actions/setup-python@v5
        if: env.AWS_ACCESS_KEY_ID != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the app and the test tools
        if: env.AWS_ACCESS_KEY_ID != ''
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply the migrations
        if: env.AWS_ACCESS_KEY_ID != ''
        run: alembic upgrade head
      - name: Ask the real model the analytics golden questions
        if: env.AWS_ACCESS_KEY_ID != ''
        run: python scripts/golden_questions.py --profile analytics --tenant golden --plant
      - name: Ask the real model the logspace golden questions
        if: env.AWS_ACCESS_KEY_ID != ''
        run: python scripts/golden_questions.py --profile logspace --tenant golden --plant
