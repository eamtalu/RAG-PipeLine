# The backend's CI: the whole test suite on every push and pull request, against a fresh
# pgvector Postgres, with the same Python and test tools as the developer's .venv.
# docs/ci-and-golden-questions.md explains the jobs.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
  TZ: Europe/London
  LOG_OUTPUT: text
  PYTHONPATH: ${{ github.workspace }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the app and the test tools
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply the migrations
        run: alembic upgrade head
      - name: Run the suite
        run: pytest -q -p no:cacheprovider
